[project]
name = "botc-bench"
version = "0.1.0"
description = "Local Blood on the Clocktower game-state editor and Codex reasoning harness"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP035", "UP037", "UP045"]
